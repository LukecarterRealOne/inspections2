name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: inspect-1.21.11

      - name: Make gradlew executable
        run: chmod +x inspect-1.21.11/gradlew

      - name: Build
        run: ./gradlew build
        working-directory: inspect-1.21.11

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: inspectitems-1.21.11
          path: inspect-1.21.11/build/libs/*.jar
